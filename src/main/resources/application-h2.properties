# Quick demo without MySQL: in-memory database, demo data enabled. Start with: --spring.profiles.active=h2
spring.datasource.url=jdbc:h2:mem:smarthub;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.seed.enabled=true
