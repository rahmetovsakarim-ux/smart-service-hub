spring.application.name=smart-service-hub
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when the app is served over HTTPS (also enabled by the "prod" profile)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Do not leak stack traces / internal messages in error responses
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Database (MySQL by default). Nothing secret is stored in this file: set the variables below. ----
# Either give a full JDBC URL in DB_URL, or the parts DB_HOST / DB_PORT / DB_NAME.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_service_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL}
spring.datasource.username=${DB_USERNAME:root}
# Intentionally no default: the app refuses to start against MySQL until DB_PASSWORD is provided.
spring.datasource.password=${DB_PASSWORD}

# update: creates/extends tables automatically (development). In production create the schema from
# database/schema.sql and run with DDL_AUTO=validate (or none).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Demo data (accounts with public passwords!). Off unless explicitly enabled; the h2/desktop profiles enable it.
app.seed.enabled=${APP_SEED_ENABLED:false}

# Optional first administrator for a fresh production database (see AdminBootstrap)
app.admin.phone=${APP_ADMIN_PHONE:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.name=${APP_ADMIN_NAME:Administrator}
app.admin.password=${APP_ADMIN_PASSWORD:}

# HTTPS: terminate TLS in a reverse proxy, or configure server.ssl.* here (see README, "Security notes").
# Behind a proxy also set: server.forward-headers-strategy=framework
