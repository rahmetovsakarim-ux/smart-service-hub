# Desktop app mode (--desktop / run-desktop.bat). No MySQL needed: data is kept in the user's home folder.
spring.datasource.url=jdbc:h2:file:${user.home}/.smart-service-hub/db;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
app.seed.enabled=true
# 8080 may be taken on a desktop, so use another port
server.port=8765
