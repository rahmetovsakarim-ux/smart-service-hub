# Local stack: MySQL + the application.
#   cp .env.example .env   (set DB_PASSWORD at least)
#   docker compose up --build
# Open http://localhost:8080
services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-smart_service_hub}
    ports:
      # bound to localhost only: the database is not reachable from other machines
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-smart_service_hub}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
      # demo data is convenient for a local try-out; set APP_SEED_ENABLED=false for anything real
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_ADMIN_PHONE: ${APP_ADMIN_PHONE:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-Administrator}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"

volumes:
  db_data:
